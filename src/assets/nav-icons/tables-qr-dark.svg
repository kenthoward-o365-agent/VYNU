<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Duotone table surface -->
  <rect x="2" y="4" width="20" height="4" rx="1" fill="#C9A96E" opacity="0.25"/>
  <!-- Table top -->
  <rect x="2" y="4" width="20" height="4" rx="1" stroke="#EBEBEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Table legs -->
  <line x1="5" y1="8" x2="5" y2="14" stroke="#EBEBEB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="8" x2="19" y2="14" stroke="#EBEBEB" stroke-width="1.5" stroke-linecap="round"/>
  <!-- QR code mini -->
  <rect x="2" y="16" width="3" height="3" rx="0.5" fill="#C9A96E" opacity="0.25" stroke="#EBEBEB" stroke-width="1"/>
  <rect x="7" y="16" width="3" height="3" rx="0.5" fill="#C9A96E" opacity="0.25" stroke="#EBEBEB" stroke-width="1"/>
  <rect x="2" y="21" width="3" height="2" rx="0.5" fill="#C9A96E" opacity="0.25" stroke="#EBEBEB" stroke-width="1"/>
  <rect x="7" y="21" width="1.5" height="2" rx="0.5" fill="#EBEBEB" opacity="0.4"/>
  <rect x="3" y="17" width="1" height="1" rx="0.25" fill="#EBEBEB"/>
  <rect x="8" y="17" width="1" height="1" rx="0.25" fill="#EBEBEB"/>
</svg>
