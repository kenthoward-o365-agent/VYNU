<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600" role="img" aria-label="VYNU">
  <!-- INTERIM MARK v3 — proportions measured from the uploaded brand sheet.
       Replace with the designer's vector export when available. -->
  <defs>
    <linearGradient id="wingL" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8B63F7"/>
      <stop offset="0.6" stop-color="#6F3DF5"/>
      <stop offset="1" stop-color="#4B27B8"/>
    </linearGradient>
    <linearGradient id="wingR" x1="1" y1="0" x2="0.6" y2="1">
